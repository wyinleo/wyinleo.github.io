---
layout: default
---
{% assign course = site.data.lessons | where: 'id', page.course_id | first %}
<ul lang="zh-CN">
    {% for slide in course.slides %}
    {% assign slide_path = '/lessons/' | append: course.id | append: '/' | append: slide.file %}
    <li>
      <a href="{{ slide_path | relative_url | uri_escape }}">{{ slide.title }}</a>
    </li>
    {% endfor %}
</ul>
